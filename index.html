<style>
  :root{
    --bg:#EAF2FC; --surface:#FFFFFF; --surface-2:#F3F8FE;
    --border:#D6E4F5; --border-soft:#E5EEF9;
    --ink:#0B2A4A; --ink-soft:#4A6382; --ink-dim:#8AA0BC;
    --primary:#1A6BDB; --primary-dark:#0B4FB3; --primary-soft:#D9E8FC; --primary-softer:#EEF5FE;
    --amber:#E8A33D; --amber-soft:#FBEBD2; --amber-dark:#8A5C16;
    --coral:#E4574C; --coral-soft:#FBE1DE; --coral-dark:#A43227;
    --shadow:0 12px 30px -16px rgba(11,42,74,0.18);
    --shadow-sm:0 4px 14px -8px rgba(11,42,74,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1000px 460px at 8% -8%, rgba(26,107,219,0.08), transparent 55%),
      radial-gradient(800px 400px at 105% 0%, rgba(232,163,61,0.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter','Noto Sans Khmer',sans-serif;
    min-height:100vh;
    padding-bottom:0;
    transition: all 0.3s ease;
  }
  .kh{font-family:'Noto Sans Khmer','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Sora','Noto Sans Khmer',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  /* App Lock Screen */
  #appLockOverlay {
    position: fixed; inset: 0; background: rgba(8, 28, 56, 0.95);
    backdrop-filter: blur(8px); z-index: 99999;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-box {
    background: #fff; border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 360px; text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
  }
  .lock-box input {
    width: 100%; font-size: 26px; text-align: center; letter-spacing: 8px;
    padding: 10px; border-radius: 12px; border: 2px solid var(--border);
    margin: 16px 0 8px; outline: none; transition: 0.2s;
  }
  .lock-box input:focus { border-color: var(--primary); }
  .clinic-logo{display:block;background:#fff;border-radius:50%;object-fit:contain;}
  .sb-brand .brand-mark.logo-mark{background:#fff !important;padding:2px;border-radius:50%;overflow:hidden;}
  .sb-brand .brand-mark.logo-mark img{width:100%;height:100%;}
  .lock-sep{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--ink-dim);font-size:11.5px;}
  .lock-sep::before,.lock-sep::after{content:"";flex:1;height:1px;background:var(--border-soft);}
  .lock-hint{font-size:11px;color:var(--ink-dim);margin:8px 0 0;}
  #lockStudyBtn{display:flex;align-items:center;justify-content:center;gap:8px;}

  /* lock-preview: reached straight from the lock screen (Study Library / Org Structure) — hide everything else */
  body.lock-preview .sidebar .sb-nav{display:none;}
  body.lock-preview #sbSyncBtn{display:none;}
  body.lock-preview #sbLockBtn .sb-label{ }
  body.lock-preview #sbLockBtn .sb-label::after{content:" (ត្រឡប់)";}
  body.lock-preview .org-edit-btn{display:none;}


  /* topbar */
  .topbar{background:var(--surface);border-bottom:1px solid var(--border-soft);padding:14px 22px;position:sticky;top:0;z-index:40;box-shadow:0 2px 16px -10px rgba(11,42,74,0.12);}
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(155deg, var(--primary), var(--primary-dark));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);}
  .brand-mark svg{width:24px;height:24px;}
  .brand-text h1{margin:0;font-size:18px;color:#fff;font-weight:700;letter-spacing:-0.01em;background:linear-gradient(155deg, var(--primary), var(--primary-dark));padding:5px 12px;border-radius:8px;display:inline-block;box-shadow:var(--shadow-sm);}
  .brand-text .sub{font-size:11.5px;color:var(--ink-dim);margin-top:1px;font-weight:500;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  
  .topbar-btn-uniform {
    font-family: 'Inter', 'Noto Sans Khmer', sans-serif;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all .15s ease;
    height: 34px;
    white-space: nowrap;
  }

  .sync-badge{
    border: 1.5px solid var(--primary);
    color: var(--primary-dark);
    background: var(--primary-softer);
  }
  .sync-badge:hover{background:var(--primary-soft);}

  .btn{border:none;cursor:pointer;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;transition:all .13s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px -6px rgba(26,107,219,0.5);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);}
  .btn-outline:hover{border-color:var(--primary);background:var(--primary-softer);}
  .btn-ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger{background:var(--coral-soft);color:var(--coral-dark);border:1px solid #f5b5af;}
  .btn-danger:hover{background:#f7cdc8;}
  .btn-success{background:#16A34A;color:#fff;border:1px solid #15803D;}
  .btn-success:hover{background:#15803D;}
  .btn-orange{background:#F97316;color:#fff;border:1px solid #EA660C;}
  .btn-orange:hover{background:#EA660C;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;}
  .btn-block{width:100%;justify-content:center;}

  .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 0;transition: all 0.3s ease;}

  /* demographics stats */
  .stats2{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px;}
  .stat-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);}
  .stat-card.debt::before{background:var(--coral);}
  .stat-card.amber::before{background:var(--amber);}
  .stat-card.highlight{background:linear-gradient(145deg, #ffffff, var(--primary-softer));border-color:var(--primary-soft);}
  .stat-card.highlight::before{background:var(--primary-dark);width:5px;}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);font-weight:700;}
  .stat-value{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;margin-top:5px;color:var(--primary-dark);}
  .stat-card.debt .stat-value{color:var(--coral-dark);}
  .stat-card.amber .stat-value{color:var(--amber-dark);}
  .stat-khmer{font-size:10px;color:var(--ink-dim);margin-top:2px;}

  /* Card Type Breakdown Section */
  .card-type-stats-panel{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }
  .card-type-stats-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-type-stats-head h4{
    margin: 0;
    font-size: 12.5px;
    color: var(--primary-dark);
    font-weight: 700;
  }
  .card-type-stats-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .type-stat-card{
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all .15s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .type-stat-card:hover{
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }
  
  .type-stat-card.type-red{ background: #FEEBEA; border-color: #F8B4AF; color: #9A241A; }
  .type-stat-card.type-red .type-stat-name{ color: #9A241A; }
  .type-stat-card.type-red .type-stat-count{ color: #A43227; }

  .type-stat-card.type-blue{ background: #EAF3FD; border-color: #B9D6F7; color: #0B4B91; }
  .type-stat-card.type-blue .type-stat-name{ color: #0B4B91; }
  .type-stat-card.type-blue .type-stat-count{ color: #0C56A4; }

  .type-stat-card.type-yellow{ background: #FEF9E7; border-color: #FDE68A; color: #85530E; }
  .type-stat-card.type-yellow .type-stat-name{ color: #85530E; }
  .type-stat-card.type-yellow .type-stat-count{ color: #8A5C16; }

  .type-stat-card.type-default{ background: var(--surface-2); border-color: var(--border); color: var(--ink); }

  .type-stat-card.active{
    box-shadow: 0 0 0 2.5px var(--primary-dark) !important;
    transform: translateY(-2px);
    font-weight: 800;
  }
  .type-stat-name{
    font-size: 10.5px;
    font-weight: 700;
    display: block;
    line-height: 1.3;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }
  .type-stat-count{ font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 800; }
  .type-stat-percent{ font-size: 9.5px; opacity: 0.85; font-weight: 600; margin-top: 1px; }

  /* Treatment Stats Grid */
  .treatment-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  /* appointments */
  .appt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .appt-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:18px 18px 14px;box-shadow:var(--shadow);}
  .appt-panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
  .appt-panel-head h3{margin:0;font-size:14px;color:var(--ink);font-weight:700;}
  .appt-panel-head .count-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:3px 9px;border-radius:999px;}
  .appt-row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--border-soft);}
  .appt-row:last-child{border-bottom:none;}
  .appt-row:hover{background:var(--surface-2);}
  .appt-time{text-align:center;min-width:92px;flex-shrink:0;}
  .appt-time .mono{font-size:11.5px;font-weight:700;color:var(--primary-dark);}
  .appt-day{font-size:9px;color:var(--ink-dim);margin-top:1px;}
  .appt-main{flex:1;min-width:0;}
  .appt-name{font-size:13px;font-weight:600;color:var(--ink);}
  .appt-meta{font-size:11.5px;color:var(--ink-dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  
  .appt-plan-badge{
    max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 7px;
    background: var(--amber-soft); color: var(--amber-dark);
    border: 1px solid rgba(232,163,61,0.4); text-align: right; flex-shrink: 0;
  }

  @media (max-width: 640px) {
    .appt-row {
      flex-direction: column;
      align-items: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      gap: 10px;
    }
    .appt-time {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 8px;
      text-align: left;
    }
    .appt-day { margin-top: 0; font-size: 10.5px; }
    .appt-main { width: 100%; }
    .appt-plan-badge { width: 100%; text-align: center; max-width: none; justify-content: center; padding: 6px; }
  }

  /* Search Input */
  .search-input-topbar{
    flex:none;width:240px;min-width:140px;padding:8px 14px;font-size:13px;
    background:#ffffff; border:2px solid var(--coral); border-radius:10px;
    box-shadow:0 0 0 3px rgba(228,87,76,0.12), inset 0 1px 3px rgba(0,0,0,0.04);
    font-weight:500; transition:all .2s ease; height: 34px;
  }
  .search-input-topbar:focus{ outline:none; border-color:var(--coral-dark); box-shadow:0 0 0 4px rgba(228,87,76,0.22); background:#fff; }
  @media (max-width:640px){ .search-input-topbar{width:100%;order:10;} }

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;}
  .section-title h2{font-size:15px;margin:0;color:var(--ink);font-weight:700;}
  .record-list{display:flex;flex-direction:column;gap:9px;margin-bottom:20px;}
  
  /* Patient Record Card Styles */
  .record-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .record-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
    background: var(--surface-2);
  }

  .record-card.has-active-appt {
    border: 1.8px solid var(--amber) !important;
    background: linear-gradient(90deg, rgba(232,163,61,0.08) 0%, var(--surface) 40%) !important;
    box-shadow: 0 4px 14px -6px rgba(232,163,61,0.35) !important;
  }
  .record-card.has-active-appt .appt-time .mono,
  .record-card.has-active-appt .appt-day {
    color: var(--amber-dark) !important;
  }
  
  .record-card.has-missing-appt {
    border: 1.8px solid var(--coral) !important;
    background: rgba(228,87,76,0.08) !important;
    box-shadow: 0 4px 14px -6px rgba(228,87,76,0.35) !important;
  }
  .record-card.has-missing-appt:hover {
    background: rgba(228,87,76,0.12) !important;
  }
  .record-card.has-missing-appt .appt-time .mono,
  .record-card.has-missing-appt .appt-day,
  .record-card.has-missing-appt .appt-name {
    color: var(--coral-dark) !important;
  }

  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-dim);background:var(--surface);border:1.5px dashed var(--border);border-radius:14px;}

  /* Modals */
  .overlay{
    position:fixed; inset:0; background:rgba(8,28,56,0.4); backdrop-filter:blur(3px); z-index:60;
    display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  }
  
  #toothHistoryModalOverlay { z-index: 75 !important; background: rgba(8,28,56,0.55) !important; }
  #doDetailOverlay          { z-index: 80 !important; background: rgba(8,28,56,0.6) !important; }
  .dd-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .dd-tx-row{display:flex;align-items:center;gap:10px;}
  .dd-tx-badge{background:var(--primary-dark);color:#fff;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.03em;flex-shrink:0;}
  .dd-tx-name{font-weight:700;font-style:italic;color:var(--ink);font-size:14px;}
  .dd-steps-wrap{margin-top:14px;padding-left:4px;}
  .dd-step-row{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:20px;}
  .dd-step-row:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border);}
  .dd-step-circ{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:var(--primary-soft);z-index:1;}
  .dd-circ-normal{background:var(--primary-soft);color:var(--primary-dark);}
  .dd-circ-appt{background:var(--amber);color:#fff;}
  .dd-circ-done{background:#16A34A;color:#fff;}
  .dd-circ-labo{background:#7C5CDB;color:#fff;}
  .dd-step-info{flex:1;min-width:0;padding-top:5px;}
  .dd-step-name{font-weight:700;color:var(--ink);font-size:13.5px;}
  .dd-step-name-appt{color:var(--amber-dark);}
  .dd-step-name-done{color:#15803D;}
  .dd-step-name-labo{color:#5B3FB8;}
  .dd-step-dt{font-size:12px;color:var(--ink-soft);}
  .dd-step-note{font-size:11.5px;color:var(--ink-dim);margin-top:3px;}
  .dd-step-del{width:22px;height:22px;flex-shrink:0;border-radius:50%;border:none;background:var(--coral-soft);color:var(--coral-dark);cursor:pointer;font-size:11px;margin-top:5px;}
  .dd-step-del:hover{background:#f0b8b1;}
  .dd-step-actions{display:flex;gap:6px;flex-shrink:0;}
  .dd-step-edit{width:22px;height:22px;flex-shrink:0;border-radius:50%;border:none;background:var(--primary-soft);color:var(--primary-dark);cursor:pointer;font-size:11px;margin-top:5px;}
  .dd-step-edit:hover{background:var(--primary-softer);outline:1px solid var(--primary);}
  .dd-step-editbox{flex:1;min-width:0;display:grid;gap:6px;background:var(--primary-softer);border:1px dashed var(--primary);border-radius:10px;padding:8px;}
  .dd-step-editbox select, .dd-step-editbox input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:var(--surface);color:var(--ink);}
  .dd-step-editbox .dd-edit-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--ink-dim);}
  .dd-autosave{font-size:11px;color:#16A34A;font-weight:700;opacity:0;transition:opacity .2s;}
  .dd-autosave.show{opacity:1;}
  .dd-addstep{margin-top:6px;padding-top:14px;border-top:1px dashed var(--border-soft);display:flex;flex-direction:column;gap:8px;}
  .dd-addstep-head{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .dd-addstep select, .dd-addstep input{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:12.5px;}
  #formOverlay              { z-index: 85 !important; }
  #xrayModalOverlay         { z-index: 95 !important; }
  #xrayGalleryOverlay       { z-index: 96 !important; }
  #reportOverlay            { z-index: 98 !important; }
  #printOverlay             { z-index: 110 !important; }

  /* Disease List Table Styles */
  .dl-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 11px; }
  .dl-table th { background: var(--surface-2); padding: 8px; border: 1px solid var(--border-soft); text-align: center; white-space: nowrap; font-weight: 700; color: var(--ink-dim); }
  .dl-table td { padding: 6px 8px; border: 1px solid var(--border-soft); text-align: center; color: var(--ink); white-space: nowrap; }
  .dl-table td.text-left { text-align: left; }

  /* Disease List mini summary badges */
  .dl-summary-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 700;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .dl-summary-badge .val {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 800;
    font-size: 13px;
  }

  /* X-Ray Gallery Layout */
  .xray-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-top: 10px;
  }
  .xray-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface-2);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px -4px rgba(0,0,0,0.1);
  }
  .xray-item:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
    box-shadow: 0 6px 14px -6px rgba(26,107,219,0.4);
  }
  .xray-item img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    background: #e0e0e0;
  }
  .xray-item .xray-info {
    padding: 8px;
    text-align: center;
    background: #fff;
    border-top: 1px solid var(--border-soft);
  }
  .xray-item .xray-date {
    font-size: 10.5px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }
  .xray-item .xray-patient {
    font-size: 11.5px;
    color: var(--ink);
    font-weight: 700;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .xray-item .xray-orphan {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--amber-dark);
    background: var(--amber-soft);
    border-radius: 5px;
    padding: 0 5px;
    margin-left: 4px;
  }
  .xray-item:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .modal{background:var(--bg);border:1px solid var(--border);border-radius:18px;max-width:760px;width:100%;box-shadow:0 30px 70px -20px rgba(11,42,74,0.4);overflow:hidden;margin-bottom:40px;}
  .modal.narrow{max-width:480px;}
  .modal-head{background:var(--surface);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-soft);}
  .modal-head h2{margin:0;font-size:15px;color:var(--ink);}
  .modal-head .x{cursor:pointer;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--ink);width:28px;height:28px;border-radius:8px;font-size:14px;}
  
  .modal-body{
    padding: 20px; 
    max-height: 84vh; 
    overflow-y: auto; 
    min-height: 0; 
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 20px; flex-wrap: wrap;
    position: sticky; bottom: -20px; 
    background: var(--bg); 
    padding: 14px 20px; 
    margin: 20px -20px -20px -20px; 
    border-top: 1px solid var(--border-soft); 
    z-index: 10;
  }
  .modal-actions .left-action{margin-right:auto;}

  /* EMR Styles */
  #patientOverlay .modal { max-width: 1100px; }
  .emr-top-split { display: grid; grid-template-columns: 320px 1fr; gap: 16px; margin-bottom: 16px; align-items: stretch; }
  @media (max-width: 992px) { .emr-top-split { grid-template-columns: 1fr; } }
  .emr-header-panel { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; margin: 0; height: 100%; }
  .emr-avatar { width: 64px; height: 64px; background: var(--primary-soft); color: var(--primary-dark); font-size: 32px; display: flex; align-items: center; justify-content: center; border-radius: 16px; }
  .emr-pat-name { margin: 0; font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; }
  .emr-actions-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; border-top: 1px dashed var(--border-soft); padding-top: 16px; }
  .emr-actions-bar .btn { padding: 8px; font-size: 11.5px; width: 100%; justify-content: center; }
  .emr-actions-bar .btn-full { grid-column: 1 / -1; }
  .emr-chart-section { background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; margin: 0; height: 100%; overflow: hidden; }
  .emr-section-head { background: var(--surface-2); padding: 12px 16px; font-size: 13px; font-weight: 800; color: var(--primary-dark); border-bottom: 1px solid var(--border); letter-spacing: 0.02em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  
  .odontogram-panel { background: transparent; width: 100%; margin: 0; overflow-x: auto; text-align: center; }
  .arch-row { display: flex; justify-content: center; gap: 3px; min-width: max-content; }
  .arch-row.upper-perm { align-items: flex-end; margin-bottom: 5px; }
  .arch-row.upper-prim { align-items: flex-start; padding-bottom: 16px; border-bottom: 1.5px dashed var(--border-soft); margin-bottom: 16px;}
  .arch-row.lower-prim { align-items: flex-end; margin-bottom: 5px; }
  .arch-row.lower-perm { align-items: flex-start; }
  .quad-gap { width: 18px; flex-shrink: 0; position: relative; }
  .quad-gap::after { content:''; position:absolute; left:50%; top:-5px; bottom:-5px; width:1.5px; background:var(--border); border-radius: 2px; }

  .tooth-cell {
    width: 26px; height: 38px; border-radius: 6px; border: 1px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-dim); font-weight: 700; transition: all .15s ease; cursor: pointer; user-select: none;
  }
  .tooth-cell.primary-tooth { height: 26px; font-size: 10px; background: var(--amber-soft); border-color: rgba(232,163,61,0.3); color: var(--amber-dark); }
  .tooth-cell.invisible { visibility: hidden; pointer-events: none; border: none; background: transparent; }
  .tooth-cell:hover:not(.invisible) { border-color: var(--primary); transform: scale(1.15); z-index: 2; box-shadow: var(--shadow-sm); }
  .tooth-cell.treated { background: var(--primary) !important; border-color: var(--primary-dark) !important; color: #fff !important; font-weight: 800 !important; box-shadow: 0 4px 10px -3px rgba(26,107,219,0.4); transform: translateY(-2px); }
  .tooth-cell.treated:hover:not(.invisible) { transform: scale(1.15) translateY(-2px); background: var(--primary-dark) !important; }
  #planningOverlay{z-index:97 !important;}
  .tooth-cell.planned { outline: 2.5px dashed #E8A33D !important; outline-offset: 2px; }
  .arch-label { font-size: 10.5px; text-align: center; color: var(--ink-dim); letter-spacing: .05em; text-transform: uppercase; margin: 10px 0; font-weight: 800; }

  .emr-notes-section { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .emr-table-wrap { overflow-x: auto; }
  .emr-table { width: 100%; border-collapse: collapse; text-align: left; }
  .emr-table th { background: #fff; padding: 12px 14px; font-size: 10.5px; text-transform: uppercase; font-weight: 800; color: var(--ink-dim); letter-spacing: 0.03em; border-bottom: 2px solid var(--border); white-space: nowrap; }
  .emr-table td { padding: 14px; border-bottom: 1px solid var(--border-soft); vertical-align: top; line-height: 1.5; }
  .emr-tr { cursor: pointer; transition: background 0.15s; }
  .emr-tr:hover { background: var(--primary-softer); }
  
  .emr-status { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .emr-status.done { background: #E0F2E9; color: #198754; border: 1px solid #19875440; }
  .emr-status.doing { background: #E1EFFF; color: #0B5ED7; border: 1px solid #0B5ED740; }
  .emr-status.missing { background: #F8D7DA; color: #721C24; border: 1px solid #721C2440; }
  .emr-status.labo { background: #EDE7FA; color: #5B3FB8; border: 1px solid #5B3FB840; }
  .emr-status.normal { background: #EEF1F5; color: #44546B; border: 1px solid #44546B40; }

  /* Form Layout */
  .form-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
  .field textarea{min-height:75px;resize:vertical;}

  .row-name-sex-age{ display: grid; grid-template-columns: 2.2fr 1fr 1fr; gap: 10px; }
  @media(max-width:640px){ .row-name-sex-age{ grid-template-columns: 1fr; } }

  .row-phone-visit-type{ display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media(max-width:768px){ .row-phone-visit-type{ grid-template-columns: 1fr; } }

  .row-three-cols { display: grid; grid-template-columns: 1fr 1.2fr 1.2fr; gap: 10px; }
  @media(max-width:768px){ .row-three-cols { grid-template-columns: 1fr; } }

  .row-treatment-proc-time { display: grid; grid-template-columns: 1.2fr 1.2fr 1fr; gap: 10px; }
  @media(max-width:768px){ .row-treatment-proc-time { grid-template-columns: 1fr; } }

  .appointment-box-wrapper{ background: var(--amber-soft); border: 1.5px dashed var(--amber); border-radius: 12px; padding: 14px; transition: all .2s ease; }
  .status-checkbox-group { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .status-check-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13.5px; font-weight: 700; user-select: none; }
  .status-check-label input { width: 17px; height: 17px; cursor: pointer; accent-color: var(--primary-dark); }
  .status-check-label.appt-lbl input { accent-color: var(--amber-dark); }
  .status-check-label.missing-lbl input { accent-color: var(--coral-dark); }
  
  .appointment-fields-grid{ display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; margin-top: 12px; border-top: 1px dashed rgba(232,163,61,0.5); padding-top: 12px; }
  @media(max-width:640px){ .appointment-fields-grid{ grid-template-columns: 1fr; } }

  .med-table-wrapper{ background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  /* ===== EMR prescription (Rx) card ===== */
  .rx-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .rx-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:linear-gradient(90deg,var(--primary-softer),var(--surface));border-bottom:1px solid var(--border);}
  .rx-title{display:flex;align-items:center;gap:10px;}
  .rx-symbol{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--primary-dark);color:#fff;font-size:20px;font-weight:700;font-family:Georgia,serif;flex-shrink:0;}
  .rx-title-main{font-size:13px;font-weight:700;color:var(--ink);}
  .rx-title-sub{font-size:10.5px;color:var(--ink-dim);margin-top:1px;}
  .rx-table{padding:0 12px;}
  .rx-head, .rx-row{display:grid;grid-template-columns:28px minmax(160px,2.2fr) minmax(170px,1.6fr) 70px 140px 30px;gap:8px;align-items:center;}
  .rx-head{font-size:10px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.03em;padding:8px 0;border-bottom:1.5px solid var(--border);}
  .rx-row{padding:8px 0;border-bottom:1px solid var(--border-soft);}
  .rx-row:last-child{border-bottom:none;}
  #medTableBody{counter-reset:rx;}
  .rx-no{counter-increment:rx;width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);font:700 11px 'IBM Plex Mono',monospace;display:inline-flex;align-items:center;justify-content:center;}
  .rx-no::before{content:counter(rx);}
  .rx-row .med-input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;background:#fff;color:var(--ink);}
  .rx-row .med-row-name{font-weight:700;}
  .rx-row .med-row-qty{text-align:center;font-family:'IBM Plex Mono',monospace;}
  .rx-dose{display:flex;gap:5px;flex-wrap:wrap;}
  .rx-tog{position:relative;display:inline-flex;align-items:center;cursor:pointer;margin:0;}
  .rx-tog input{position:absolute;opacity:0;pointer-events:none;}
  .rx-tog span{display:inline-block;padding:5px 9px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink-dim);font-size:11.5px;font-weight:600;line-height:1.2;user-select:none;}
  .rx-tog input:checked + span{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .rx-tog input:focus-visible + span{outline:2px solid var(--primary);outline-offset:1px;}
  .rx-del{width:26px;height:26px;border-radius:50%;border:none;background:var(--coral-soft);color:var(--coral-dark);cursor:pointer;font-size:12px;}
  .rx-del:hover{background:#f0b8b1;}
  .rx-empty{display:none;text-align:center;font-size:12px;color:var(--ink-dim);padding:16px 8px;}
  .rx-empty span{font-size:11px;opacity:.75;}
  #medTableBody:empty + .rx-empty{display:block;}
  .rx-card .quick-med-pills{margin:0;padding:10px 12px;border-top:1px dashed var(--border);background:var(--surface-2);align-items:center;}
  .rx-quick-label{font-size:11px;color:var(--ink-dim);font-weight:700;margin-right:2px;}
  .rx-card .q-pill{background:#fff;}
  .rx-lbl{display:none;}
  @media (max-width:760px){
    .rx-head{display:none;}
    .rx-row{grid-template-columns:28px 90px minmax(0,1fr) 30px;grid-template-areas:"no name name del" "no dose dose dose" "no qty date date";row-gap:8px;padding:10px 0;}
    .rx-row > .rx-no{grid-area:no;align-self:start;margin-top:6px;}
    .rx-row > .rx-c-name{grid-area:name;}
    .rx-row > .rx-c-dose{grid-area:dose;}
    .rx-row > .rx-c-qty{grid-area:qty;}
    .rx-row > .rx-c-date{grid-area:date;}
    .rx-row > .rx-del{grid-area:del;align-self:start;margin-top:4px;}
    .rx-lbl{display:block;font-size:10px;font-weight:700;color:var(--ink-dim);margin-bottom:3px;}
  }

  .med-bar{ position:relative; display:flex; flex-direction:column; gap:9px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 38px 12px 12px; margin-bottom:10px; }
  .med-bar-section-label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); margin-bottom:-3px; }
  .med-bar-clinic{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; }
  .med-bar-clinic .med-row-date{ width:130px; flex-shrink:0; }
  .med-bar-clinic .med-row-qty{ width:70px; flex-shrink:0; }
  .med-bar-divider{ width:100%; height:1px; background:var(--border); flex-shrink:0; }
  .med-bar-medicine{ width:100%; }
  .med-bar-medicine .med-row-name{ width:100%; font-weight:700; }
  .med-bar-del{ position:absolute; top:9px; right:9px; padding:3px 8px; font-size:11px; }
  @media (max-width:640px){
    .med-bar-clinic{ width:100%; }
  }
  .med-table-header{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .med-table{ width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .med-table th{ background: var(--surface-2); color: var(--ink-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .med-table td{ padding: 6px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  .med-table tr:last-child td{ border-bottom: none; }
  .med-input{ width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12px; font-family: inherit; color: var(--ink); }
  .med-input:focus{ outline:none; border-color:var(--primary); }
  .med-time-checks{ display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .med-time-checks label{ display: inline-flex; align-items: center; gap: 3px; cursor: pointer; font-weight: 500; margin: 0; text-transform: none; }
  .quick-med-pills{ display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .q-pill{ font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; color: var(--ink-soft); }
  .q-pill:hover{ background: var(--primary-soft); color: var(--primary-dark); }
  
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px;}
  .detail-item .k{font-size:10.5px;text-transform:uppercase;color:var(--ink-dim);letter-spacing:.05em;font-weight:700;}
  .detail-item .v{font-size:13.5px;color:var(--ink);margin-top:2px;}

  /* print sheets */
  .print-sheet{background:#fff;color:#14243F;font-family:'Inter',sans-serif;padding:8mm 2mm;}
  .ps-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2.5px solid var(--primary);padding-bottom:14px;margin-bottom:20px;}
  .ps-clinic{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;color:var(--primary-dark);}
  .ps-sub{font-size:11.5px;color:#64789A;margin-top:4px;}
  .ps-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-dark);background:var(--primary-soft);padding:5px 13px;border-radius:999px;}
  .ps-head-right{text-align:right;}
  .ps-printed{font-size:10.5px;color:#8AA0BC;margin-top:6px;}
  .ps-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 22px;margin:6px 0 18px;}
  .ps-info-item .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#8AA0BC;font-weight:700;}
  .ps-info-item .v{font-size:13.5px;color:#14243F;margin-top:3px;font-weight:600;}
  .ps-section-title{font-size:13px;font-weight:700;color:var(--primary-dark);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid #DCE7F5;}
  .ps-foot{text-align:center;font-size:11px;color:#8AA0BC;margin-top:20px;}
  .ps-visit-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px;}
  .ps-visit-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#8AA0BC;padding:6px 8px;border-bottom:1.5px solid #14243F;}
  .ps-visit-table td{padding:6px 8px;border-bottom:1px solid #E6EEF8;color:#34496B;}
  .ps-visit-table td.mono, .ps-visit-table th.mono{font-family:'IBM Plex Mono',monospace;}

  @media print {
      body.printing-panel { background: #fff !important; padding: 0 !important; margin: 0 !important; }
      body.printing-panel * { visibility: hidden !important; }
      body.printing-panel #reportOverlay, body.printing-panel #reportOverlay * { visibility: visible !important; }
      body.printing-panel #reportOverlay { position: absolute !important; left: 0; top: 0; width: 100%; display: block !important; padding: 0; background: none; }

      body.printing-disease-list #page-diseaselist button { display: none !important; }

      body.printing-full-report #reportOverlay, body.printing-full-report #reportOverlay * { visibility: visible !important; }
      body.printing-full-report #printOverlay { display: none !important; }
      body.printing-full-report #reportOverlay { position: absolute !important; left: 0; top: 0; width: 100%; display: block !important; padding: 0; background: none; overflow: visible; }
      body.printing-full-report #reportOverlay .modal { max-width: 100%; border: none; box-shadow: none; margin: 0; overflow: visible; }
      body.printing-full-report #reportOverlay .modal-head { display: none !important; }
      body.printing-full-report #reportOverlay .modal-body { padding: 0; overflow: visible; max-height: none; }
      body.printing-full-report #reportTopActions { display: none !important; }
      body.printing-full-report .card-type-stats-head button,
      body.printing-full-report #clearTypeFilterBtn { display: none !important; }

    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) .topbar,

    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #detailOverlay,

    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #patientOverlay, 
    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #toothHistoryModalOverlay{ display:none !important; }
    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #printOverlay{ position:static !important; inset:auto; background:none !important; backdrop-filter:none !important; padding:0 !important; display:block !important; }
    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #printOverlay .modal{ box-shadow:none !important; border:none !important; max-width:100% !important; border-radius:0 !important; background:none !important; margin:0 !important; }
    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #printOverlay .modal-head, 
    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #printOverlay .modal-actions{ display:none !important; }
    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) #printOverlay .modal-body{ padding:0 !important; max-height:none !important; overflow:visible !important; }
    body:not(.printing-panel):not(.printing-disease-list):not(.printing-full-report) .print-sheet{padding:0;width:100%;}

  body.mobile-mode .wrap{ max-width: 480px; padding: 12px 12px 0; }

  body.mobile-mode .card-type-stats-grid{ grid-template-columns: repeat(2, 1fr); }

  body.mobile-mode .form-grid{ grid-template-columns: 1fr; }

    .stats2{grid-template-columns:repeat(4,1fr);}

  .patient-card-badge { max-width: 200px; text-align: right; white-space: normal; line-height: 1.4; }
  
  @media (max-width: 768px) {
    .emr-table thead { display: none; }
    .emr-table, .emr-table tbody, .emr-table tr, .emr-table td { display: block; width: 100%; }
    .emr-tr { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm); padding-top: 4px; }
    .emr-table td { padding: 10px 14px; border-bottom: 1px dashed var(--border-soft); text-align: left !important; }
    .emr-table td:last-child { border-bottom: none; }
    .emr-table td::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.03em; }

  /* ==========================================================
     EMR SHELL — left sidebar, header, pages
     ========================================================== */
  :root{
    --sb-w:252px; --sb-w-rail:72px;
    --sb-bg:#0C3B7C; --sb-ink:#A9C2E4; --sb-ink-dim:#8FB0DE; --sb-line:rgba(255,255,255,.09);
  }
  .app-shell{display:flex;min-height:100vh;}
  .main{flex:1 1 auto;min-width:0;}

  .sidebar{
    position:sticky;top:0;align-self:flex-start;
    height:100vh;height:100dvh;
    width:var(--sb-w);flex:0 0 var(--sb-w);
    background:var(--sb-bg);color:var(--sb-ink);
    display:flex;flex-direction:column;z-index:50;overflow:hidden;
    transition:width .18s ease, flex-basis .18s ease, transform .22s ease;
  }
  .sb-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 14px;flex:none;}
  .sb-brand .brand-mark{width:40px;height:40px;}
  .sb-brand-title{color:#fff;font-size:14.5px;font-weight:700;line-height:1.3;}
  .sb-brand-sub{font-size:11.5px;color:var(--sb-ink-dim);margin-top:2px;font-weight:500;}

  .sb-nav{flex:1 1 auto;overflow-y:auto;padding:4px 10px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;}
  .sb-group-label{font-size:11.5px;font-weight:600;color:var(--sb-ink-dim);padding:16px 12px 6px;}
  .sb-item{
    width:100%;display:flex;align-items:center;gap:12px;position:relative;
    padding:9px 12px;border:none;border-radius:10px;background:transparent;
    color:var(--sb-ink);font:inherit;font-size:13.5px;font-weight:500;text-align:left;cursor:pointer;
    transition:background .13s ease,color .13s ease;
  }
  .sb-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .sb-item.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--amber);}
  .sb-ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .sb-label{flex:1 1 auto;min-width:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-label small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:400;color:var(--sb-ink-dim);margin-top:1px;}
  .sb-item.active .sb-label small{color:#B4CBEA;}
  .sb-badge{
    min-width:22px;height:20px;padding:0 6px;border-radius:999px;flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    background:rgba(255,255,255,.12);color:#DCE8FA;
  }
  .sb-badge[hidden]{display:none;}
  .sb-badge.amber{background:var(--amber);color:#3A2708;}
  .sb-badge.warn{background:var(--coral);color:#fff;}

  .sb-foot{flex:none;padding:8px 10px 12px;border-top:1px solid var(--sb-line);}
  body:not(.lock-preview) #sbLockBtn{display:none;}
  #sbSyncBtn{justify-content:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;}
  #sbSyncBtn:hover{background:rgba(255,255,255,.16);}
  #sbSyncBtn .sb-label{flex:none;color:#fff;font-weight:600;}
  .sb-clinic{padding:8px 12px 6px;font-size:12px;line-height:1.35;color:#DCE8FA;font-weight:600;text-align:center;}
  .sb-foot .sb-item{padding:8px 12px;font-size:12.5px;}
  .sb-foot .sb-ico{width:18px;height:18px;}
  #sbCollapseBtn .sb-ico{transition:transform .18s ease;}

  .sb-scrim{display:none;position:fixed;inset:0;background:rgba(4,20,44,.5);z-index:49;}

  .sidebar :focus-visible,.chip:focus-visible,.tb-menu:focus-visible,.kpi:focus-visible,.link-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* header */
  .topbar{padding:12px 24px;}
  .topbar .topbar-inner{max-width:1240px;flex-wrap:wrap;}
  .tb-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .tb-menu{display:none;width:38px;height:38px;flex:none;align-items:center;justify-content:center;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;}
  .tb-menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
  .page-head h1{margin:0;font-size:19px;line-height:1.3;color:var(--ink);font-weight:700;}
  .page-head .sub{font-size:12px;color:var(--ink-dim);margin-top:1px;font-weight:500;}
  .btn-add{background:var(--primary-dark);color:#fff;border:none;box-shadow:var(--shadow-sm);}
  .btn-add:hover{background:var(--primary);}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;pointer-events:none;}
  .search-wrap .search-input-topbar{padding-left:34px;border:1.5px solid var(--border);box-shadow:none;background:var(--surface);}
  .search-wrap .search-input-topbar:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,107,219,.15);}
  .wrap{max-width:1240px;padding:22px 24px 40px;}

  /* page tools + chips */
  .page-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--border);background:var(--surface);color:var(--ink-soft);
    font-family:'Inter','Noto Sans Khmer',sans-serif;font-size:12.5px;font-weight:600;
  }
  .chip:hover{border-color:var(--primary);}
  .chip.active{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .chip-n{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.85;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-dim);display:inline-block;}
  .dot.amber{background:var(--amber);} .dot.coral{background:var(--coral);}
  .dot.teal{background:var(--primary);} .dot.blue{background:#0B5ED7;} .dot.violet{background:#7C5CDB;}
  .chip.active .dot{box-shadow:0 0 0 2px rgba(255,255,255,.55);}
  .link-btn{background:none;border:none;padding:2px 4px;font:inherit;font-size:12px;font-weight:600;color:var(--primary-dark);cursor:pointer;border-radius:6px;}
  .link-btn:hover{text-decoration:underline;}

  /* dashboard KPIs */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  @media (max-width:1180px){ .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .kpi-grid > :last-child:nth-child(odd){grid-column:1 / -1;} }
  .appt-daytag{display:inline-block;font-family:inherit;font-size:9.5px;font-weight:700;line-height:1.4;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);margin-bottom:2px;}
  .appt-daytag.today{background:var(--primary-soft);color:var(--primary-dark);}
  .appt-daytag.tomorrow{background:var(--amber-soft);color:var(--amber-dark);}
  .kpi{flex:1;
    display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
    padding:14px 16px;border-radius:14px;border:1px solid var(--border-soft);
    background:var(--surface);box-shadow:var(--shadow-sm);font:inherit;color:inherit;
  }
  .kpi:hover{border-color:var(--primary);}
  .kpi-ico{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary-dark);}
  .kpi-ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .kpi.amber .kpi-ico{background:var(--amber-soft);color:var(--amber-dark);}
  .kpi.coral .kpi-ico{background:var(--coral-soft);color:var(--coral-dark);}
  .kpi.blue .kpi-ico{background:#E1EFFF;color:#0B5ED7;}
  .kpi-txt{min-width:0;}
  .kpi-val,.kpi-lbl{display:block;}
  .kpi-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;line-height:1;color:var(--ink);}
  .kpi-lbl{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.3;}

  /* appointments page */
  .appt-group-head{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:13.5px;font-weight:700;color:var(--ink);}
  .appt-group-head:first-child{margin-top:4px;}
  .appt-group-head .count-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:2px 9px;border-radius:999px;}
  .appt-hint{font-size:11.5px;font-weight:500;color:var(--ink-dim);}
  .appt-list{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow);}
  .appt-list .appt-row.appt-missed .appt-time .mono{color:var(--coral-dark);}
  .appt-list .appt-row.appt-missed .appt-plan-badge{background:var(--coral-soft);color:var(--coral-dark);border-color:rgba(228,87,76,.4);}


  /* ---------- Inventory ---------- */
  .inv-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .inv-select{height:34px;max-width:180px;padding:0 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;}
  .inv-select:focus{outline:none;border-color:var(--primary);}
  .inv-status{font-size:11.5px;color:var(--ink-dim);}
  .inv-status.ok{color:var(--primary-dark);} .inv-status.warn{color:var(--coral-dark);}
  .inv-name{font-weight:700;font-size:13.5px;color:var(--ink);}
  .inv-cat{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .inv-qty{font-size:16px;font-weight:700;color:var(--ink);}
  .inv-pill{display:inline-flex;margin-left:6px;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .inv-pill.ok{background:var(--primary-soft);color:var(--primary-dark);}
  .inv-pill.low,.inv-pill.expiring{background:var(--amber-soft);color:var(--amber-dark);}
  .inv-pill.out,.inv-pill.expired{background:var(--coral-soft);color:var(--coral-dark);}
  .emr-table td.inv-actions{white-space:nowrap;text-align:right;}
  .inv-btn{width:30px;height:30px;margin-left:4px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer;}
  .inv-btn:hover{border-color:var(--primary);background:var(--primary-softer);}
  .inv-btn.del:hover{border-color:#f5b5af;background:var(--coral-soft);}
  .inv-btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .inv-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #invFormOverlay{z-index:90 !important;}
  body[data-page="org"] .topbar .search-wrap, body[data-page="org"] #fabAdd,
  body[data-page="inventory"] .topbar .search-wrap,
  body[data-page="inventory"] #fabAdd,
  body[data-page="xray"] .topbar .search-wrap,
  body[data-page="xray"] #fabAdd,
  body[data-page="study"] .topbar .search-wrap, body[data-page="study"] #fabAdd{display:none;}
  @media (max-width:640px){
    .inv-row-2{grid-template-columns:1fr;}
    .emr-table td.inv-actions{text-align:left;}
    .emr-table td.inv-actions::before{display:none !important;}
    .inv-tools{width:100%;}
    .inv-tools .search-wrap{flex:1 1 100%;}
  }

  /* ---------- X-Ray page ---------- */
  .xr-name{font-size:14px;font-weight:700;color:var(--primary-dark);}
  .emr-tr:hover .xr-name{text-decoration:underline;}
  .xr-orphan{font-size:10.5px;font-weight:700;color:var(--amber-dark);background:var(--amber-soft);border-radius:6px;padding:1px 7px;margin-left:8px;}
  .emr-table td.xr-act{text-align:right;white-space:nowrap;}
  .kpi[data-noop]{cursor:default;}
  .xv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .xv-item{cursor:pointer;}
  .xv-item:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .xv-item img{background:#0A1A33;}
  #xrayLightbox{z-index:97 !important;background:rgba(4,14,32,.86) !important;align-items:center;padding:12px;}
  .xl-box{width:min(1000px,100%);background:#0A1A33;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);}
  #bookViewerOverlay{z-index:97 !important;background:rgba(4,14,32,.86) !important;align-items:center;padding:12px;}
  #galleryLightbox{z-index:97 !important;background:rgba(4,14,32,.86) !important;align-items:center;padding:12px;}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .gl-item{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface-2);cursor:pointer;border:1px solid var(--border-soft);transition:border-color .12s ease;}
  .gl-item:hover{border-color:var(--primary);}
  .gl-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .gl-item.gl-broken{display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:22px;}
  .gl-item:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .bv-stage{min-height:50vh;max-height:80vh;background:#050F22;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .bv-stage iframe{width:100%;height:80vh;border:0;display:block;background:#fff;}
  .bv-stage img{max-width:100%;max-height:80vh;object-fit:contain;display:block;}
  .bv-ph{width:100%;min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:30px;}
  .bv-ph svg{width:64px;height:64px;}
  .bv-ph-title{font-size:19px;font-weight:700;}
  .bv-ph-author{font-size:13px;opacity:.85;margin-top:-6px;}
  @media (max-width:640px){ .bv-stage iframe, .bv-stage img{height:70vh;} .bv-ph{min-height:40vh;} }
  .xl-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;color:#DCE8FA;}
  .xl-title{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .xl-btns{display:flex;align-items:center;gap:8px;flex:none;}
  .xl-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:40vh;background:#050F22;}
  .xl-stage img{max-width:100%;max-height:78vh;object-fit:contain;display:block;}
  .xl-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:56px;border:none;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:26px;cursor:pointer;}
  .xl-nav:hover{background:rgba(255,255,255,.26);}
  .xl-nav.prev{left:10px;} .xl-nav.next{right:10px;}
  .xl-nav[disabled]{opacity:.25;cursor:default;}
  .xl-note{position:absolute;color:#9DBAE3;font-size:12px;padding:0 20px;text-align:center;}
  @media (max-width:640px){ .emr-table td.xr-act{text-align:left;} .emr-table td.xr-act::before{display:none !important;} }

  /* ---------- sidebar: inner wrapper, edge handle, sync states ---------- */
  .sidebar{overflow:visible;}
  .sb-inner{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;}
  .sb-handle{
    position:absolute;top:74px;right:-14px;z-index:2;
    width:28px;height:28px;padding:0;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--border);background:var(--surface);color:var(--primary-dark);
    box-shadow:0 6px 14px -6px rgba(6,20,44,.55);
    transition:background .13s ease,color .13s ease,border-color .13s ease;
  }
  .sb-handle:hover{background:var(--primary);border-color:var(--primary);color:#fff;}
  .sb-handle .sb-ico{width:15px;height:15px;stroke-width:2.4;}
  .sb-handle:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  body.sb-collapsed .sb-handle .sb-ico{transform:rotate(180deg);}
  @keyframes sbspin{to{transform:rotate(360deg);}}
  #sbSyncBtn.syncing .sb-ico{animation:sbspin .9s linear infinite;}
  #sbSyncBtn.sync-err{color:#FFB4AB;}
  @media (prefers-reduced-motion:reduce){ #sbSyncBtn.syncing .sb-ico{animation:none;} }

  /* ==========================================================
     STUDY LIBRARY
     ========================================================== */
  .sb-feature{background:rgba(255,255,255,.07);color:#fff;font-weight:600;margin-bottom:4px;}
  .sb-feature:hover{background:rgba(255,255,255,.14);}
  .sb-feature.active{background:rgba(255,255,255,.16);}

  .lib-hero{position:relative;overflow:hidden;border-radius:20px;padding:24px 28px;margin-bottom:18px;color:#fff;
    background:linear-gradient(118deg,#0A2A57 0%,#0C3B7C 46%,#1A6BDB 100%);box-shadow:var(--shadow);}
  .lib-hero-text{position:relative;z-index:1;max-width:560px;}
  .lib-hero h2{margin:0;font-family:'Noto Serif Khmer',Georgia,serif;font-size:25px;line-height:1.45;font-weight:700;}
  .lib-hero p{margin:6px 0 0;font-size:13px;color:#C6D9F5;}
  .lib-deco{position:absolute;right:12px;bottom:0;height:118%;width:auto;pointer-events:none;}

  .lib-tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;margin-bottom:16px;border-radius:14px;background:var(--primary-soft);}
  .lib-tab{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:none;border-radius:10px;background:none;cursor:pointer;
    font-family:'Inter','Noto Sans Khmer',sans-serif;font-size:13.5px;font-weight:600;color:var(--primary-dark);}
  .lib-tab svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .lib-tab .n{font-size:11px;opacity:.7;}
  .lib-tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .lib-tab:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .lib-panel[hidden]{display:none;}

  /* ---------- bookshelf ---------- */
  .shelf-wrap{padding:6px 22px 8px;border-radius:20px;border:1px solid var(--border-soft);
    background:linear-gradient(180deg,#F5F9FF 0%,#E8F0FB 100%);box-shadow:inset 0 2px 10px rgba(11,42,74,.06);}
  .shelf-head{display:flex;align-items:center;gap:10px;margin:18px 0 4px;font-family:'Noto Serif Khmer',Georgia,serif;font-size:15px;font-weight:700;color:var(--ink);}
  .shelf-head::after{content:"";flex:1;height:1px;background:var(--border);}
  .shelf-head .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-dim);order:2;}
  .shelf{--gap:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));column-gap:var(--gap);padding:0 calc(var(--gap) / 2);}
  .bk{position:relative;display:flex;flex-direction:column;padding-top:22px;min-width:0;}
  .bk-open{display:block;position:relative;z-index:1;text-decoration:none;color:inherit;cursor:pointer;border-radius:3px 7px 7px 3px;}
  .bk-open:focus-visible{outline:2px solid var(--amber);outline-offset:3px;}
  .bk-cover{position:relative;aspect-ratio:2 / 3;border-radius:3px 7px 7px 3px;overflow:hidden;background:#12284A;
    box-shadow:3px 5px 12px rgba(11,42,74,.38);transform-origin:bottom left;transition:transform .2s ease, box-shadow .2s ease;}
  .bk-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;z-index:3;
    background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(255,255,255,.20) 55%,rgba(0,0,0,.08));}
  .bk-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px 12px 12px 20px;color:#fff;}
  .bk-ph-mark{width:26px;height:26px;opacity:.28;align-self:flex-end;}
  .bk-ph-title{font-family:'Noto Serif Khmer',Georgia,serif;font-weight:700;font-size:14.5px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .bk-ph-author{margin-top:8px;font-size:10.5px;opacity:.85;line-height:1.35;}
  .bk-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:#12284A;}
  .bk:hover .bk-cover,.bk-open:focus-visible .bk-cover{transform:translateY(-8px) rotate(-1.6deg);box-shadow:6px 14px 20px rgba(11,42,74,.42);}
  .bk-stand{position:relative;z-index:0;height:13px;margin:0 calc(var(--gap) / -2);
    background:linear-gradient(180deg,#DCE6F5 0,#B9CAE5 42%,#94AACF 100%);box-shadow:0 10px 12px -8px rgba(11,42,74,.5);}
  .bk-cap{padding:12px 2px 18px;}
  .bk-title{font-family:'Noto Serif Khmer',Georgia,serif;font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .bk-author{margin-top:2px;font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bk-edit{position:absolute;top:30px;right:8px;z-index:4;width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.94);color:var(--ink);font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:0;transition:opacity .13s ease;}
  .bk:hover .bk-edit,.bk-edit:focus-visible{opacity:1;}
  @media (hover:none){ .bk-edit{opacity:.95;} }

  /* ---------- lessons ---------- */
  .nt-group-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:15px;font-weight:700;color:var(--ink);}
  .nt-group-head:first-child{margin-top:2px;}
  .nt-group-head .mono{font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:2px 9px;border-radius:999px;}
  .nt-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .nt-card{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 18px 14px 22px;cursor:pointer;overflow:hidden;
    background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;box-shadow:var(--shadow-sm);
    transition:border-color .13s ease, box-shadow .13s ease;}
  .nt-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent,var(--primary));}
  .nt-card:hover{border-color:var(--accent,var(--primary));box-shadow:var(--shadow);}
  .nt-card:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .nt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;}
  .nt-topic{font-weight:700;color:var(--accent,var(--primary-dark));}
  .nt-date{color:var(--ink-dim);font-size:11px;}
  .nt-title{margin:0;font-family:'Noto Serif Khmer',Georgia,serif;font-size:17px;line-height:1.5;font-weight:700;color:var(--ink);}
  .nt-snip{margin:0;font-size:12.5px;line-height:1.7;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .nt-foot{margin-top:2px;font-size:11.5px;color:var(--ink-dim);}

  #noteReader{z-index:92 !important;background:rgba(8,28,56,.55) !important;}
  .nr-sheet{width:min(780px,100%);margin:0 auto 40px;padding:26px 44px 30px;border-radius:20px;background:#FCFDFF;
    border:1px solid var(--border);box-shadow:0 30px 70px -20px rgba(11,42,74,.45);}
  .nr-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .nr-topic{font-size:12px;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);padding:3px 12px;border-radius:999px;}
  .nr-actions{display:flex;align-items:center;gap:8px;}
  .nr-x{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;}
  .nr-title{margin:6px 0 8px;font-family:'Noto Serif Khmer',Georgia,serif;font-size:28px;line-height:1.5;font-weight:700;color:var(--ink);}
  .nr-meta{display:flex;flex-wrap:wrap;gap:6px 16px;padding-bottom:16px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--ink-dim);}
  .nr-body{padding-top:18px;font-family:'Noto Serif Khmer','Noto Sans Khmer',Georgia,serif;font-size:16.5px;line-height:2;color:var(--ink);}
  .nr-body p{margin:0 0 14px;}
  .nr-body h3{margin:24px 0 8px;font-family:'Noto Serif Khmer',Georgia,serif;font-size:20px;line-height:1.5;color:var(--primary-dark);}
  .nr-body h4{margin:18px 0 6px;font-family:'Noto Serif Khmer',Georgia,serif;font-size:17px;line-height:1.5;color:var(--ink);}
  .nr-body ul{margin:0 0 14px;padding-left:22px;}
  .nr-body li{margin-bottom:4px;}
  .nr-ref{margin-top:18px;padding-top:14px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--ink-soft);}
  .nr-ref:empty{display:none;}
  .nr-pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
  .nr-pager .btn[disabled]{opacity:.35;cursor:default;}

  /* ---------- practitioners ---------- */
  .st-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;}
  .st-row{position:relative;background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow-sm);cursor:pointer;display:flex;flex-direction:column;transition:border-color .12s ease;}
  .st-row:hover{border-color:var(--primary);}
  .st-row:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .st-photo{width:100%;aspect-ratio:1/1;background:var(--primary-soft);overflow:hidden;}
  .st-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .st-photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif Khmer',Georgia,serif;font-size:44px;font-weight:700;color:#fff;}
  .st-card-body{padding:11px 12px 13px;}
  .st-name{font-size:14px;font-weight:700;color:var(--ink);line-height:1.35;}
  .st-note{margin-top:7px;font-size:11.5px;color:var(--ink-soft);
